name: Compilation et autotest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - name: Autotest sur un vrai serveur NeoForge 21.1.215
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          set +e
          timeout 900 ./gradlew runServer --stacktrace 2>&1 | tee selftest.log
          set -e
          grep -q "SELFTEST OK" selftest.log || { echo "::error::L'autotest a échoué"; grep -n "SELFTEST\|\[test\]\|ERROR\|Exception\|Mixin" selftest.log | tail -80; exit 1; }

      - name: Journal de l'autotest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-autotest
          path: |
            selftest.log
            run/logs/
          if-no-files-found: ignore

      - name: Publier le .jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Citizen Réalisme (build ${{ github.run_number }})
          body: |
            À mettre dans le dossier mods du serveur ET dans Citizen Updater (joueurs PC : HUD, textures parchemin).
            Les joueurs console (Citizen Bedrock) n'ont rien à installer.
            Testé automatiquement sur un vrai serveur NeoForge 21.1.215.
          files: build/libs/citizenrealisme-*.jar
          make_latest: true
